<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0A192F" />
  <g transform="translate(16, 8) scale(0.94)">

    <!-- Defs -->
    <defs>
      <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FBBF24" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#EA580C" />
      </linearGradient>

      <linearGradient id="navyMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#162D4A" />
        <stop offset="100%" stop-color="#0A182B" />
      </linearGradient>

      <linearGradient id="navySideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E3E66" />
        <stop offset="100%" stop-color="#10253E" />
      </linearGradient>

      <linearGradient id="tealCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4" />
        <stop offset="40%" stop-color="#0D9488" />
        <stop offset="100%" stop-color="#059669" />
      </linearGradient>

      <linearGradient id="tealBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0891B2" />
        <stop offset="100%" stop-color="#047857" />
      </linearGradient>

      <filter id="subtleShadow" x="-10%" y="-10%" width="125%" height="125%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A192F" flood-opacity="0.22" />
      </filter>
    </defs>

    <!-- Sun -->
    <circle cx="180" cy="185" r="105" fill="url(#sunGradient)" />

    <!-- Left Building (Shorter Tower) -->
    <path d="M 105 235 L 195 235 L 195 385 L 105 385 Z" fill="url(#navyMainGrad)" />
    <!-- Left Building Windows -->
    <g fill="#FFFFFF" opacity="0.95">
      <rect x="122" y="255" width="16" height="24" rx="2" />
      <rect x="156" y="255" width="16" height="24" rx="2" />

      <rect x="122" y="295" width="16" height="24" rx="2" />
      <rect x="156" y="295" width="16" height="24" rx="2" />

      <rect x="122" y="335" width="16" height="24" rx="2" />
      <rect x="156" y="335" width="16" height="24" rx="2" />
    </g>

    <!-- Center/Right Tall Building (Angular Slanted Roofline) -->
    <!-- 3D Perspective Facet (Left side) -->
    <path d="M 195 130 L 255 90 L 255 385 L 195 385 Z" fill="url(#navySideGrad)" />
    <!-- Main Front Facet -->
    <path d="M 255 90 L 335 150 L 335 385 L 255 385 Z" fill="url(#navyMainGrad)" />
    <!-- Angled Roofline Coping Accent -->
    <path d="M 195 130 L 255 90 L 335 150 L 335 162 L 255 104 L 195 142 Z" fill="#38BDF8" opacity="0.8" />

    <!-- Center Building Windows (Grid) -->
    <g fill="#FFFFFF" opacity="0.95">
      <rect x="270" y="170" width="18" height="28" rx="2" />
      <rect x="302" y="195" width="18" height="28" rx="2" />

      <rect x="270" y="215" width="18" height="28" rx="2" />
      <rect x="302" y="240" width="18" height="28" rx="2" />

      <rect x="270" y="260" width="18" height="28" rx="2" />
      <rect x="302" y="285" width="18" height="28" rx="2" />

      <rect x="270" y="305" width="18" height="28" rx="2" />
      <rect x="302" y="330" width="18" height="28" rx="2" />
    </g>

    <!-- Site Supervisor / Engineer Silhouette -->
    <!-- Shoulders & Torso -->
    <path d="M 335 342 C 335 308, 365 296, 385 296 C 405 296, 435 308, 435 342 L 435 385 L 335 385 Z" fill="url(#navyMainGrad)" />
    <!-- V-neck collar accent -->
    <path d="M 374 320 L 385 340 L 396 320 Z" fill="#0D9488" />
    <!-- Head -->
    <circle cx="385" cy="272" r="23" fill="url(#navyMainGrad)" />
    <!-- Hardhat Dome -->
    <path d="M 356 266 C 358 240, 412 240, 414 266 Z" fill="#FFFFFF" />
    <!-- Hardhat Brim Visor -->
    <path d="M 350 264 C 350 260, 420 260, 420 264 C 420 269, 350 269, 350 264 Z" fill="#E2E8F0" />
    <!-- Hardhat Center Ridge Accent -->
    <path d="M 383 241 L 387 241 L 387 262 L 383 262 Z" fill="#0D9488" />

    <!-- Dynamic Foundation Checkmark Motif -->
    <!-- Beveled underside shadow -->
    <path d="M 68 345 C 120 405, 185 450, 260 450 C 335 450, 400 395, 455 310 C 438 335, 395 395, 310 410 C 235 422, 155 385, 105 328 Z" fill="url(#tealBevelGrad)" opacity="0.6" />
    <!-- Main checkmark curve -->
    <path d="M 68 335 C 118 395, 180 438, 255 438 C 330 438, 395 385, 450 298 C 435 322, 390 380, 305 395 C 230 408, 150 372, 100 318 Z" fill="url(#tealCheckGrad)" filter="url(#subtleShadow)" />

  </g>
</svg>