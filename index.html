<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="SiteSaathi - Smart, Multi-Trade Site Management App for Contractors. Construction Management Made Simple. 100% Offline." />
    <title>SiteSaathi — Construction Management Made Simple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Zero-Flicker Native Launch Preloader Styles */
      body {
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        width: 100vw;
        background: #FFFFFF;
        box-sizing: border-box;
      }
      .pre-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
      }
      .pre-splash-logo {
        width: 140px;
        height: 140px;
      }
      .pre-splash-title {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: -1px;
        line-height: 1.1;
        margin: 0;
      }
      .pre-splash-title .site { color: #0F2744; }
      .pre-splash-title .saathi { color: #0D9488; }
      .pre-splash-sub {
        font-size: 13px;
        font-weight: 700;
        color: #64748B;
        margin: 4px 0 0 0;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600/20 selection:text-blue-900 transition-colors duration-200">
    <div id="root">
      <div class="pre-splash">
        <img class="pre-splash-logo" src="/images/sitesaathi_emblem.svg" alt="SiteSaathi" />
        <div>
          <h1 class="pre-splash-title"><span class="site">Site</span><span class="saathi">Saathi</span></h1>
          <p class="pre-splash-sub">Construction Management Made Simple</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
